# Bitcoin timestamps for the daily roots, made on GitHub's Linux runners
# (the `ots` client doesn't run on Windows). On every push of a new root it
# requests a stamp; every 6 hours it upgrades pending stamps once a Bitcoin
# block confirms them (usually within a few hours).
name: OpenTimestamps
on:
  push:
    branches: [main]
    paths: ['20*.json']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: ots
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opentimestamps-client
      - name: Stamp new roots, upgrade pending stamps
        run: |
          for f in 20*.json; do
            [ -e "$f" ] || continue
            if [ ! -e "$f.ots" ]; then
              ots stamp "$f" || echo "stamp failed for $f (will retry next run)"
            else
              ots upgrade "$f.ots" || true
            fi
          done
          rm -f *.bak
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ots'
          if ! git diff --cached --quiet; then
            git commit -m "ots: stamp/upgrade"
            git push
          fi
